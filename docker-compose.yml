# One command runs the whole stack: docker compose up --build
# Every variable has a working default so a fresh clone needs no .env file.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propvisit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propvisit}
      POSTGRES_DB: ${POSTGRES_DB:-propvisit}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    healthcheck:
      # Longer start period than the Dockerfile default: migrations and the first seed run first.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 5
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-propvisit}:${POSTGRES_PASSWORD:-propvisit}@postgres:5432/${POSTGRES_DB:-propvisit}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      # Runs migrations on every start; seeds demo data only when the database is empty.
      SEED_ON_START: ${SEED_ON_START:-true}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - uploads:/app/uploads  # local image storage survives container rebuilds
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # Same image as the backend, different process: sends queued emails outside the request.
    build: ./backend
    command: ["python", "-m", "app.workers.run"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-PropVisit <noreply@propvisit.dev>}
    healthcheck:
      # Healthy once the worker has registered itself in Redis.
      test: ["CMD", "python", "-c", "import sys; from rq import Worker; from app.core.redis import get_sync_redis; sys.exit(0 if Worker.all(connection=get_sync_redis()) else 1)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
