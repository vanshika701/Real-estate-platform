[project]
name = "propvisit-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI's Depends() in default arguments is idiomatic
]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and test credentials are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole session so pooled asyncpg connections stay usable across tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
